<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E7585"/></marker></defs>
<rect width="1440" height="720" fill="#FFFFFF"/>
<rect x="35" y="25" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="57" y="67" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="57" dy="0">BUILDER</tspan>
</text>
<circle cx="74" cy="101" r="18" fill="#20384F"/>
<text x="74" y="111" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">1</tspan>
</text>
<text x="105" y="112" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">Build and test</tspan>
</text>
<text x="57" y="159" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Use reviewed inputs</tspan>
<tspan x="57" dy="39">and lockfiles. Keep results.</tspan>
</text>
<rect x="515" y="25" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="537" y="67" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="537" dy="0">REVIEWER</tspan>
</text>
<circle cx="554" cy="101" r="18" fill="#20384F"/>
<text x="554" y="111" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="554" dy="0">2</tspan>
</text>
<text x="585" y="112" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="585" dy="0">Review packages</tspan>
</text>
<text x="537" y="159" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="537" dy="0">Approve exact packages</tspan>
<tspan x="537" dy="39">and files with their records.</tspan>
</text>
<rect x="995" y="25" width="410" height="195" rx="12" fill="#EFF7F6" stroke="#B9C7D0" stroke-width="2"/>
<text x="1017" y="67" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="1017" dy="0">SIGNER</tspan>
</text>
<circle cx="1034" cy="101" r="18" fill="#20384F"/>
<text x="1034" y="111" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1034" dy="0">3</tspan>
</text>
<text x="1065" y="112" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="1065" dy="0">Sign packages</tspan>
</text>
<text x="1017" y="159" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="1017" dy="0">Protected signing session.</tspan>
<tspan x="1017" dy="39">Keep private key separate.</tspan>
</text>
<polyline points="445,122 506,122" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="925,122 986,122" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1200,220 1200,251" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="995" y="260" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="1017" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="1017" dy="0">PUBLISHER</tspan>
</text>
<circle cx="1034" cy="336" r="18" fill="#20384F"/>
<text x="1034" y="346" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1034" dy="0">4</tspan>
</text>
<text x="1065" y="347" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="1065" dy="0">Publish catalog</tspan>
</text>
<text x="1017" y="394" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="1017" dy="0">Publish approved catalog.</tspan>
<tspan x="1017" dy="39">Record version and access</tspan>
</text>
<rect x="515" y="260" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="537" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="537" dy="0">PUBLISHER</tspan>
</text>
<circle cx="554" cy="336" r="18" fill="#20384F"/>
<text x="554" y="346" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="554" dy="0">5</tspan>
</text>
<text x="585" y="347" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="585" dy="0">Install and verify</tspan>
</text>
<text x="537" y="394" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="537" dy="0">Only from signed cache.</tspan>
<tspan x="537" dy="39">Use approved hashes.</tspan>
</text>
<rect x="35" y="260" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="57" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="57" dy="0">REVIEWER</tspan>
</text>
<circle cx="74" cy="336" r="18" fill="#20384F"/>
<text x="74" y="346" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">6</tspan>
</text>
<text x="105" y="347" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">Check destination</tspan>
</text>
<text x="57" y="394" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Review software, module</tspan>
<tspan x="57" dy="39">and access-test results.</tspan>
</text>
<polyline points="995,357 934,357" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="515,357 454,357" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="240,455 240,486" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="35" y="495" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="57" y="537" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B6E73" text-anchor="start">
<tspan x="57" dy="0">RELEASE AUTHORITY</tspan>
</text>
<circle cx="74" cy="571" r="18" fill="#20384F"/>
<text x="74" y="581" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">7</tspan>
</text>
<text x="105" y="582" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">Make available</tspan>
</text>
<text x="57" y="629" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Publish a new release.</tspan>
<tspan x="57" dy="39">Update module entry point.</tspan>
</text>
<text x="515" y="533" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="515" dy="0">Two-person review</tspan>
</text>
<text x="515" y="579" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#526372" text-anchor="start">
<tspan x="515" dy="0">The second member may review, approve the release and sign</tspan>
<tspan x="515" dy="40">when assigned those roles. Builds never receive the private key.</tspan>
<tspan x="515" dy="40">Changed files return to preparation and review.</tspan>
</text>
