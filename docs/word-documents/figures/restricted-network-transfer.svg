<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E7585"/></marker></defs>
<rect width="1440" height="720" fill="#FFFFFF"/>
<rect x="35" y="35" width="410" height="180" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="74" cy="66" r="18" fill="#20384F"/>
<text x="74" y="76" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">1</tspan>
</text>
<text x="105" y="77" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">Plan for destination</tspan>
</text>
<text x="57" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Reviewed lockfiles, inputs</tspan>
<tspan x="57" dy="39">and system software.</tspan>
</text>
<rect x="515" y="35" width="410" height="180" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="554" cy="66" r="18" fill="#20384F"/>
<text x="554" y="76" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="554" dy="0">2</tspan>
</text>
<text x="585" y="77" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="585" dy="0">Collect inputs</tspan>
</text>
<text x="537" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="537" dy="0">Collect required sources,</tspan>
<tspan x="537" dy="39">tools or a signed cache.</tspan>
</text>
<rect x="995" y="35" width="410" height="180" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="1034" cy="66" r="18" fill="#20384F"/>
<text x="1034" y="76" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1034" dy="0">3</tspan>
</text>
<text x="1065" y="77" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="1065" dy="0">Transfer and check</tspan>
</text>
<text x="1017" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="1017" dy="0">Approved route and file list.</tspan>
<tspan x="1017" dy="39">Check sender and hashes.</tspan>
</text>
<polyline points="445,128 506,128" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="925,128 986,128" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="35" y="280" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="35" dy="0">At the destination, follow the reviewed build or install plan</tspan>
</text>
<polyline points="1200,215 1200,303 355,303 355,327" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1200,303 1085,303 1085,327" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="35" y="337" width="640" height="166" rx="12" fill="#EFF7F6" stroke="#B9C7D0" stroke-width="2"/>
<text x="57" y="379" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="57" dy="0">Build from sources</tspan>
</text>
<text x="57" y="426" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Build and test the approved sources.</tspan>
<tspan x="57" dy="39">Finish review and release checks.</tspan>
</text>
<rect x="765" y="337" width="640" height="166" rx="12" fill="#EFF7F6" stroke="#B9C7D0" stroke-width="2"/>
<text x="787" y="379" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="787" dy="0">Install signed packages</tspan>
</text>
<text x="787" y="426" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="787" dy="0">Verify signatures, hashes and compatibility.</tspan>
<tspan x="787" dy="39">Use only cache files; keep the build records.</tspan>
</text>
<polyline points="355,503 355,544" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1085,503 1085,544" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="35" y="554" width="1370" height="91" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<text x="57" y="596" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="57" dy="0">Approve destination</tspan>
</text>
<text x="57" y="643" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
</text>
<text x="500" y="596" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="500" dy="0">Test software, modules and access before making it available.</tspan>
</text>
<text x="35" y="689" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526372" text-anchor="start">
<tspan x="35" dy="0">Collect and check missing or changed inputs again. Never transfer private signing keys.</tspan>
</text>
