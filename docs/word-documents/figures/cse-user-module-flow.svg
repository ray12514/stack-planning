</text>
<text x="105" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">Select the compiler</tspan>
<tspan x="105" dy="39">surface</tspan>
</text>
<text x="57" y="176" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">module load</tspan>
<tspan x="57" dy="39">cse/&lt;compiler-surface&gt;</tspan>
</text>
<rect x="520" y="48" width="400" height="206" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
