<tspan x="559" dy="0">2</tspan>
</text>
<text x="590" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="590" dy="0">Choose one lane</tspan>
</text>
<text x="542" y="137" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="542" dy="0">module load Serial</tspan>
<tspan x="542" dy="39">or module load MPI</tspan>
</text>
