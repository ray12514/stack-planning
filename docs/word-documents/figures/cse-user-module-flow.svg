<text x="35" y="312" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="35" dy="0">Accepted release</tspan>
</text>
<rect x="35" y="345" width="650" height="182" rx="12" fill="#EFF7F6" stroke="#B9C7D0" stroke-width="2"/>
<text x="57" y="387" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="57" dy="0">Software presented to users</tspan>
</text>
<text x="57" y="434" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Foundation: ambient; no package modules.</tspan>
<tspan x="57" dy="39">Core tools: approved modules.</tspan>
<tspan x="57" dy="39">Payloads: approved modules.</tspan>
</text>
<rect x="755" y="345" width="650" height="182" rx="12" fill="#EFF7F6" stroke="#B9C7D0" stroke-width="2"/>
<text x="777" y="387" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="777" dy="0">Validated compiler and provider chain</tspan>
</text>
<text x="777" y="434" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="777" dy="0">Test exact compiler, MPI, fabric and launcher.</tspan>
<tspan x="777" dy="39">Validate supported dependencies.</tspan>
<tspan x="777" dy="39">Check approved GPU selections.</tspan>
</text>
<line x1="35" y1="565" x2="1405" y2="565" stroke="#B9C7D0" stroke-width="2"/>
<text x="35" y="609" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#526372" text-anchor="start">
<tspan x="35" dy="0">Serial and MPI conflict. Expose only accepted paths; test clean sessions on the supported node types.</tspan>
</text>
