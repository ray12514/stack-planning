<tspan x="1044" dy="0">3</tspan>
</text>
<text x="1075" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="1075" dy="0">Load the package</tspan>
</text>
<text x="1027" y="137" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="1027" dy="0">module load</tspan>
<tspan x="1027" dy="39">&lt;package&gt;/&lt;version&gt;</tspan>
</text>
