<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E7585"/></marker></defs>
<rect width="1440" height="660" fill="#FFFFFF"/>
<rect x="35" y="45" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="74" cy="76" r="18" fill="#20384F"/>
<text x="74" y="86" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">1</tspan>
</text>
<text x="105" y="87" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">Prepare release</tspan>
</text>
<text x="57" y="134" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Fix the input versions.</tspan>
<tspan x="57" dy="39">Resolve packages;</tspan>
<tspan x="57" dy="39">review lockfiles.</tspan>
</text>
<rect x="515" y="45" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="554" cy="76" r="18" fill="#20384F"/>
<text x="554" y="86" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="554" dy="0">2</tspan>
</text>
<text x="585" y="87" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="585" dy="0">Approve inputs</tspan>
</text>
<text x="537" y="134" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="537" dy="0">Check sources and tools.</tspan>
<tspan x="537" dy="39">Transfer when required.</tspan>
</text>
<rect x="995" y="45" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="1034" cy="76" r="18" fill="#20384F"/>
<text x="1034" y="86" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1034" dy="0">3</tspan>
</text>
<text x="1065" y="87" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="1065" dy="0">Build and test</tspan>
</text>
<text x="1017" y="134" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="1017" dy="0">Build on the target system.</tspan>
<tspan x="1017" dy="39">Keep tests and results.</tspan>
</text>
<polyline points="445,143 506,143" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="925,143 986,143" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1200,240 1200,345" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="995" y="355" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="1034" cy="386" r="18" fill="#20384F"/>
<text x="1034" y="396" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1034" dy="0">4</tspan>
</text>
<text x="1065" y="397" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="1065" dy="0">Independent review</tspan>
</text>
<text x="1017" y="444" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="1017" dy="0">Approve the exact files.</tspan>
<tspan x="1017" dy="39">Return any needed fixes.</tspan>
</text>
<rect x="515" y="355" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="554" cy="386" r="18" fill="#20384F"/>
<text x="554" y="396" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="554" dy="0">5</tspan>
</text>
<text x="585" y="397" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="585" dy="0">Publish and check</tspan>
</text>
<text x="537" y="444" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="537" dy="0">Use the approved method.</tspan>
<tspan x="537" dy="39">Test destination software</tspan>
<tspan x="537" dy="39">and user access.</tspan>
</text>
<rect x="35" y="355" width="410" height="195" rx="12" fill="#F5F8FA" stroke="#B9C7D0" stroke-width="2"/>
<circle cx="74" cy="386" r="18" fill="#20384F"/>
<text x="74" y="396" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="74" dy="0">6</tspan>
</text>
<text x="105" y="397" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#20384F" text-anchor="start">
<tspan x="105" dy="0">User access</tspan>
<tspan x="105" dy="39">and support</tspan>
</text>
<text x="57" y="483" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#263746" text-anchor="start">
<tspan x="57" dy="0">Monitor approved software.</tspan>
<tspan x="57" dy="39">Keep records and backups.</tspan>
</text>
<polyline points="995,452 934,452" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="515,452 454,452" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="240,355 240,250" fill="none" stroke="#5E7585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/>
<text x="270" y="291" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#526372" text-anchor="start">
<tspan x="270" dy="0">Changed inputs</tspan>
<tspan x="270" dy="35">start a new release for review</tspan>
</text>
<line x1="35" y1="588" x2="1405" y2="588" stroke="#B9C7D0" stroke-width="2"/>
<text x="35" y="631" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#526372" text-anchor="start">
<tspan x="35" dy="0">One release record links the exact inputs, decisions, files and results from each destination.</tspan>
</text>
